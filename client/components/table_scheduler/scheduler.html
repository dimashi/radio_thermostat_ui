<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Scheduler</title>
    <link rel="stylesheet" href="../../css/scheduler.css">
    <script defer src="../../js/scheduler.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<main x-data="scheduler()">
    <div role="status" class="panel" x-show="!stateLoaded">Loading Thermostat State...</div>
    
    <section class="panel" x-show="stateLoaded">
        <h2 class="panel-title">Thermostat State</h2>
        
        <dl class="state-row">
            <dt class="state-label">Current Temp:</dt> 
            <dd class="state-value" x-text="state?.temp ?? 'N/A'"></dd>
            
            <dt class="state-label">Target Heat:</dt> 
            <dd class="state-value" x-text="state?.t_heat ?? 'N/A'"></dd>
        </dl>
        
        <dl class="state-row">
            <dt class="state-label">Time (day hour:min):</dt>
            <dd class="state-value">
                <span :class="getTimeDiffClass()" x-text="state?.time ? state.time.day + ' ' + String(state.time.hour).padStart(2, '0') + ':' + String(state.time.minute).padStart(2, '0') : 'N/A'"></span>
                <span x-text="state?.time_status ?? 'N/A'"></span>
            </dd>
            
            <dt class="state-label" x-show="getThermostatToServerTimeDiff > 1">Server Time (day hour:min):</dt>
            <dd class="state-value" x-show="getThermostatToServerTimeDiff > 1" x-text="state?.server_time ? state.server_time.day + ' ' + String(state.server_time.hour).padStart(2, '0') + ':' + String(state.server_time.minute).padStart(2, '0') : 'N/A'"></dd>
        </dl>
        
        <div class="state-row">
            <button class="toggle-link" @click="showOtherFields = !showOtherFields" x-text="showOtherFields ? '▼ Hide' : '▶ Show Other State Fields'"></button>
        </div>
        
        <div class="panel-nested" x-show="showOtherFields">
            <dl class="state-row">
                <dt class="state-label">Thermostat Mode:</dt> <dd class="state-value" x-text="state?.tmode ?? 'N/A'"></dd>
                <dt class="state-label">Fan Mode:</dt> <dd class="state-value" x-text="state?.fmode ?? 'N/A'"></dd>
            </dl>
            <dl class="state-row">
                <dt class="state-label">Override:</dt> <dd class="state-value" x-text="state?.override ?? 'N/A'"></dd>
                <dt class="state-label">Hold:</dt> <dd class="state-value" x-text="state?.hold ?? 'N/A'"></dd>
            </dl>
            <dl class="state-row">
                <dt class="state-label">Thermostat State:</dt> <dd class="state-value" x-text="state?.tstate ?? 'N/A'"></dd>
                <dt class="state-label">Fan State:</dt> <dd class="state-value" x-text="state?.fstate ?? 'N/A'"></dd>
                <dt class="state-label">Type Post:</dt> <dd class="state-value" x-text="state?.t_type_post ?? 'N/A'"></dd>
            </dl>
        </div>
    </section>

    <div role="status" class="panel" x-show="!scheduleLoaded">Loading Thermostat Schedule...</div>
    
    <section class="panel" x-show="scheduleLoaded">
        <h2 class="panel-title">Thermostat Schedule</h2>
        
        <ul class="schedule-list">
            <template x-for="(array, key) in days" :key="key">
                <li class="day-row">
                    <strong class="day-label" x-text="key"></strong>
                    
                    <template x-for="(timeSlot, index) in array" :key="timeSlot.time">
                        <span class="time-slot">
                            <div class="input-wrapper">
                                <input type="time" x-model="timeSlot.time" aria-label="Time slot time">
                                <template x-if="hasChanged(key, index, 'time')">
                                    <small class="diff" x-text="'was: ' + getOriginalValue(key, index, 'time')"></small>
                                </template>
                            </div>
                            <div class="input-wrapper">
                                <input type="number" class="temp" x-model="timeSlot.temp" aria-label="Time slot temperature">
                                <template x-if="hasChanged(key, index, 'temp')">
                                    <small class="diff" x-text="'was: ' + getOriginalValue(key, index, 'temp')"></small>
                                </template>
                            </div>
                        </span>
                    </template>
                </li>
            </template>
        </ul>
        <button class="submit-button" @click="submitSchedule()">Submit Schedule</button>
    </section>
</main>
</body>
</html>
